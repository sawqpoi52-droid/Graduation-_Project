name: Trigger Monthly Reports
on:
  schedule:
    # اليوم الأول من كل شهر الساعة 7 صباحًا بتوقيت السعودية (UTC+3) = 04:00 UTC
    - cron: '0 4 1 * *'
  
  workflow_dispatch:

jobs:
  trigger-monthly:
    runs-on: ubuntu-latest
    
    steps:
      - name: Wake up Render server
        run: |
          echo "Waking up Render server..."
          curl --max-time 60 ${{ secrets.RENDER_BACKEND_URL }} || true
          echo "Waiting 15 seconds for server to fully wake up..."
          sleep 15

      - name: Call SecureCheck Backend API (Monthly)
        run: |
          echo "Sending monthly report trigger..."
          
          RESPONSE=$(curl --fail --max-time 60 -s -w "\n%{http_code}" \
               -X POST ${{ secrets.RENDER_BACKEND_URL }}/api/trigger-reports \
               -H "Content-Type: application/json" \
               -d "{\"frequency\": \"monthly\", \"token\": \"${{ secrets.CRON_SECRET_TOKEN }}\"}")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo "Response code: $HTTP_CODE"
          echo "Response body: $BODY"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Monthly reports triggered successfully"
          else
            echo "❌ Failed with HTTP code: $HTTP_CODE"
            exit 1
          fi
